<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PN3C - ALERTE</title>
<style>
body{font-family:Arial;text-align:center;background:#f5f5f5;margin:0}
.header{background:linear-gradient(to right,#FF8200,white,#009A44);padding:15px;font-weight:bold}
#btn{width:280px;height:280px;border-radius:50%;background:red;color:white;border:8px solid white;font-size:32px;font-weight:bold;box-shadow:0 0 40px red;margin-top:30px}
#status{margin-top:20px;font-weight:bold}
</style></head><body>
<div class="header">PN3C - 1 CLIC = SECOURS</div>
<button id="btn">🆘<br>ALERTE<br>ROUGE</button>
<div id="status">Active ton GPS et clique</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

const firebaseConfig = { // <-- COLLE TA CONFIG ICI
  apiKey: "...", authDomain: "...", databaseURL: "...", projectId: "..."
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let canAlert = true;
document.getElementById('btn').onclick = () => {
 if(!canAlert) return alert("Alerte déjà envoyée, attends 2 min");
 navigator.geolocation.getCurrentPosition(pos => {
   const alerte = {
     lat: pos.coords.latitude, lon: pos.coords.longitude,
     lien: `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`,
     heure: new Date().toLocaleString('fr-FR'), statut: "NOUVEAU"
   };
   // ENVOI DOUBLE - C'EST TON IDÉE DE GÉNIE
   push(ref(db, 'alertes_fds'), alerte);
   push(ref(db, 'stats_pn3c'), alerte);
   
   document.getElementById('status').innerHTML = "✅ ALERTE ENVOYÉE AUX FDS!<br><a href='"+alerte.lien+"' target='_blank'>Voir ma position</a>";
   canAlert = false; setTimeout(()=>canAlert=true, 120000);
 }, () => alert("Active ton GPS!"));
}
</script></body></html>
